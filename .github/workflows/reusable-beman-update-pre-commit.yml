name: Pre-commit auto-update

on:
  workflow_call:
    secrets:
      APP_ID:
        required: false
      PRIVATE_KEY:
        required: false
jobs:
  auto-update:
    if: github.repository_owner == 'bemanproject'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.13
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate --freeze
      - name: Apply updated hooks to all files
        run: pre-commit run --all-files
        continue-on-error: true
      - name: Sync cookiecutter if exemplar
        run: |
          if [[ -d "cookiecutter" ]]; then
            cp .pre-commit-config.yaml 'cookiecutter/{{cookiecutter.project_name}}/.pre-commit-config.yaml'
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: update/pre-commit-autoupdate
          title: Auto-update pre-commit hooks
          commit-message: Auto-update pre-commit hooks
          body: Update versions of tools in pre-commit configs to latest version
          labels: dependencies
